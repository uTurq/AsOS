[project]
name = "asos"
version = "0.1.0"
description = "AsOS (Assist Operating System) — a persistent local academic assistant core service, with Claude as its reasoning engine."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "typer>=0.12",
    "requests>=2.31",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Dev/test-only fallback keyring backend. Production (Windows) never
    # needs this — `keyring` auto-selects Windows Credential Manager
    # there. This exists purely so the test suite and this Linux sandbox
    # can exercise the real CredentialVault code path end-to-end.
    "keyrings.alt>=5.0",
    "fpdf2>=2.7",  # dev/test-only: generates PDF fixtures for parser tests
]

[project.scripts]
asos = "asos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
